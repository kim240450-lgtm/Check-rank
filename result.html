<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>Detailed Analysis | Nammon Gaming</title>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@700&family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root { --val-red: #ff4655; --val-black: #0f1923; --val-blue: #00eeff; }
        * { box-sizing: border-box; }
        body { margin: 0; background: var(--val-black); color: white; font-family: 'Kanit', sans-serif; overflow-x: hidden; }

        /* พื้นหลัง Dynamic */
        #bg-image {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -2; object-fit: cover;
            filter: brightness(0.3) blur(1px);
            transition: opacity 1s ease-in-out;
        }

        .video-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, transparent 20%, var(--val-black) 100%);
            z-index: -1;
        }

        .container { max-width: 900px; margin: 0 auto; padding: 40px 20px; position: relative; z-index: 1; }
        
        .result-card, .stat-box, .match-item, .recommend-box { 
            background: rgba(15, 25, 35, 0.7) !important; 
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
        }

        .result-card { padding: 40px; border-top: 4px solid var(--val-red); margin-bottom: 20px; text-align: center; }
        .rank-img { width: 140px; filter: drop-shadow(0 0 15px var(--val-red)); }
        .player-name { font-family: 'Oswald'; font-size: 36px; margin: 10px 0; text-transform: uppercase; }

        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; margin-bottom: 30px; }
        .stat-box { padding: 20px; text-align: center; }
        .stat-label { color: #aaa; font-size: 12px; text-transform: uppercase; }
        .stat-value { font-family: 'Oswald'; font-size: 26px; color: var(--val-red); }

        .match-list { margin-top: 20px; }
        .match-item { 
            display: grid; grid-template-columns: 1fr 1fr 1.5fr 1fr;
            align-items: center; margin-bottom: 12px; padding: 15px 25px; border-left: 5px solid #333;
        }
        .match-item.win { border-left-color: #00ff88; }
        .match-item.loss { border-left-color: #ff4655; }
        
        .match-map { font-weight: bold; font-family: 'Oswald'; color: #ccc; text-transform: uppercase; }
        .match-kda { font-family: 'Oswald'; font-size: 20px; text-align: center; }
        .match-score { font-family: 'Oswald'; font-size: 20px; text-align: right; }

        .recommend-box { padding: 20px; border: 1px dashed var(--val-blue); margin-bottom: 30px; display: flex; align-items: center; gap: 15px; }
        .header-title { font-family: 'Oswald'; letter-spacing: 2px; border-left: 4px solid var(--val-red); padding-left: 15px; text-align: left; margin-bottom: 20px; text-transform: uppercase; }
        
        #loader { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--val-black); display: flex; justify-content: center; align-items: center; z-index: 999; font-family: 'Oswald'; font-size: 24px; color: var(--val-red); }
        .back-btn { display: inline-block; margin-top: 30px; color: white; text-decoration: none; background: rgba(255,46,85,0.2); padding: 12px 30px; border-radius: 5px; font-family: 'Oswald'; border: 1px solid var(--val-red); }
        .back-btn:hover { background: var(--val-red); }
    </style>
</head>
<body>

    <img id="bg-image" src="https://media.tenor.com/fSbe_mN-v64AAAAd/valorant-jett.gif" alt="background">
    <div class="video-overlay"></div>

    <div id="loader">กำลังวิเคราะห์...</div>

    <div class="container" id="content" style="display: none;">
        <div class="result-card">
            <h1 class="player-name" id="resName">-</h1>
            <img id="resIcon" src="" class="rank-img">
            <div style="font-family: 'Oswald'; font-size: 32px;" id="resRank">-</div>
            <div style="font-size: 18px; color: #ccc;">Current RR: <span id="resRR" style="color: var(--val-blue);">0</span></div>
        </div>

        <div class="recommend-box">
            <div style="font-size: 35px;">💡</div>
            <div><b style="color: var(--val-blue); font-family: 'Oswald';">NAMMON AI ADVICE</b><br><span id="recText">ประมวลผล...</span></div>
        </div>

        <h3 class="header-title">Overall Stats (Last 5)</h3>
        <div class="stats-grid">
            <div class="stat-box">
                <div class="stat-label">Winrate</div>
                <div class="stat-value" id="winRate">0%</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">Avg K/D Ratio</div>
                <div class="stat-value" id="avgKD">0.00</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">Main Agent</div>
                <div class="stat-value" id="topAgent" style="font-size: 22px;">-</div>
            </div>
        </div>

        <h3 class="header-title">Recent Matches (K/D/A)</h3>
        <div class="match-list" id="matchList"></div>

        <div style="text-align: center;">
            <a href="index.html" class="back-btn">BACK TO TRACKER</a>
        </div>
    </div>

    <script>
        // --- ส่วนที่เก็บลิงก์ GIF ของแต่ละ Agent ---
        const agentBgs = {
            "Omen": "https://media1.tenor.com/m/gXZNSfLz1oIAAAAd/casting-paranoia-omen.gif",
            "Gekko": "https://media1.tenor.com/m/wFIs-MGVge8AAAAd/ready-to-fight-gekko.gif",
            "Phoenix": "https://media1.tenor.com/m/ALrncBgxe5AAAAAC/throwing-fire-ball-phoenix.gif",
            "Reyna": "https://i.pinimg.com/originals/83/c5/e3/83c5e3d2d9ab4a60926b407a7fe5d8dc.gif",
            "Sova":"https://media1.tenor.com/m/Kb8T-ovodmkAAAAd/shooting-the-arrow-sova.gif",
            "Jett":"https://i.pinimg.com/originals/7f/8d/5f/7f8d5ff419fabb57ae53e84822a93d97.gif",
            "Sage":"https://media1.tenor.com/m/V4tnmWFCzwwAAAAd/using-power-sage.gif",
            "Deadlock":"https://media1.tenor.com/m/BTEh3zyx30kAAAAd/nods-deadlock.gif",
            "Iso":"https://media1.tenor.com/m/9qL9xVg8bQIAAAAC/shooting-iso.gif",
            "Yoru": "https://media1.tenor.com/m/yXP6zzQEUnQAAAAd/firing-yoru.gif",
            "Viper": "https://media1.tenor.com/m/R73g0XKmBzQAAAAd/reload-viper.gif",
            "Brimstone": "https://media1.tenor.com/m/CvNM8mNpr3YAAAAd/ready-to-shoot-brimstone.gif",
            "Breach": "https://media1.tenor.com/m/SyWdxSGs2DQAAAAd/screaming-breach.gif",
            "Fade": "https://media1.tenor.com/m/upE4lq-omZwAAAAd/haunt-fade.gif",
            "Kay O": "https://media1.tenor.com/m/Yht1tydy354AAAAd/shooting-kay-o.gif",
            "Chamber": "https://media1.tenor.com/m/8XzUmzJ0UVoAAAAd/take-aim-sentinel.gif",
            "Astra": "https://media1.tenor.com/m/yMJqekwzYukAAAAd/astral-form-astra.gif",
            "Neon": "https://media1.tenor.com/m/y46MPGi4f3wAAAAd/electric-eyes-neon.gif",
            "Clove": "https://i.pinimg.com/originals/96/e2/1b/96e21b696951775d7fffef9de0b88ef6.gif",
            "Raze": "https://media1.tenor.com/m/yMJqekwzYukAAAAd/astral-form-astra.gif",
            "Killjoy": "https://media1.tenor.com/m/9RN75wdiGoMAAAAd/on-my-way-killjoy.gif",
            "default": "https://i.pinimg.com/originals/7f/8d/5f/7f8d5ff419fabb57ae53e84822a93d97.gif"
        };

        const API_KEY = "HDEV-7ee27c84-96b2-46d1-b705-c10ccb330267";
        const params = new URLSearchParams(window.location.search);
        const name = params.get('name');
        const tag = params.get('tag');

        async function fetchDetailedData() {
            if(!name || !tag) return;
            try {
                const mmrRes = await fetch(`https://api.henrikdev.xyz/valorant/v1/mmr/ap/${encodeURIComponent(name)}/${encodeURIComponent(tag)}`, { headers: {'Authorization': API_KEY}});
                const mmrData = await mmrRes.json();
                const matchRes = await fetch(`https://api.henrikdev.xyz/valorant/v3/matches/ap/${encodeURIComponent(name)}/${encodeURIComponent(tag)}?size=5`, { headers: {'Authorization': API_KEY}});
                const matchData = await matchRes.json();

                if (mmrData.status === 200 && matchData.status === 200) {
                    document.getElementById('resName').innerText = `${name} #${tag}`;
                    document.getElementById('resRank').innerText = mmrData.data.currenttierpatched;
                    document.getElementById('resRR').innerText = mmrData.data.ranking_in_tier;
                    document.getElementById('resIcon').src = mmrData.data.images.large;

                    let wins = 0, totalKills = 0, totalDeaths = 0, agents = {};
                    const matchList = document.getElementById('matchList');
                    matchList.innerHTML = '';

                    matchData.data.forEach(match => {
                        const me = match.players.all_players.find(p => p.name.toLowerCase() === name.toLowerCase());
                        if(me) {
                            const k = me.stats.kills, d = me.stats.deaths, a = me.stats.assists;
                            totalKills += k; totalDeaths += d;
                            agents[me.character] = (agents[me.character] || 0) + 1;
                            const won = match.teams[me.team.toLowerCase()].has_won;
                            if(won) wins++;

                            const item = document.createElement('div');
                            item.className = `match-item ${won ? 'win' : 'loss'}`;
                            item.innerHTML = `<div class="match-result-text" style="color: ${won ? '#00ff88' : '#ff4655'}">${won ? 'WIN' : 'LOSS'}</div><div class="match-map">${match.metadata.map}</div><div class="match-kda">${k}/${d}/${a}</div><div class="match-score">${match.teams.blue.rounds_won}-${match.teams.red.rounds_won}</div>`;
                            matchList.appendChild(item);
                        }
                    });

                    // หา Main Agent และเปลี่ยนพื้นหลัง
                    const favoriteAgent = Object.keys(agents).reduce((a, b) => agents[a] > agents[b] ? a : b);
                    const bgImg = document.getElementById('bg-image');
                    bgImg.src = agentBgs[favoriteAgent] || agentBgs["default"];

                    const avgKD = (totalKills / (totalDeaths || 1)).toFixed(2);
                    document.getElementById('winRate').innerText = (wins/5*100) + "%";
                    document.getElementById('avgKD').innerText = avgKD;
                    document.getElementById('topAgent').innerText = favoriteAgent;
                    document.getElementById('recText').innerText = avgKD >= 1.1 ? `โหดจัดดดด เล่น ${favoriteAgent} เก่งว่ะ` : `หาเน้นจังหวะ Support เพื่อนด้วย ${favoriteAgent} ดูครับ`;

                    document.getElementById('loader').style.display = "none";
                    document.getElementById('content').style.display = "block";
                }
            } catch (err) { document.getElementById('loader').innerText = "❌ เกิดข้อผิดพลาด"; }
        }
        fetchDetailedData();
    </script>
</body>
</html>
