<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>Analysis Result | Nammon Gaming</title>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@700&family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root { --val-red: #ff4655; --val-black: #0f1923; --val-gray: #1f2326; }
        body { margin: 0; background: var(--val-black); color: white; font-family: 'Kanit', sans-serif; padding: 20px; }
        
        .container { max-width: 900px; margin: 0 auto; }
        .result-card { background: var(--val-gray); padding: 40px; border-radius: 10px; border-top: 4px solid var(--val-red); margin-bottom: 20px; text-align: center; }
        
        /* Stats Grid */
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-top: 20px; }
        .stat-box { background: rgba(0,0,0,0.3); padding: 20px; border-radius: 8px; border: 1px solid rgba(255,70,85,0.2); }
        .stat-label { color: #888; font-size: 14px; text-transform: uppercase; }
        .stat-value { font-family: 'Oswald'; font-size: 24px; color: var(--val-red); }

        .rank-img { width: 150px; filter: drop-shadow(0 0 15px var(--val-red)); }
        .player-name { font-family: 'Oswald'; font-size: 32px; margin: 10px 0; }
        
        .win { color: #00ff88; }
        .loss { color: #ff4655; }
        
        #loader { font-family: 'Oswald'; font-size: 24px; color: var(--val-red); text-align: center; margin-top: 100px; }
        .back-btn { display: inline-block; margin-top: 30px; color: white; text-decoration: none; background: #333; padding: 10px 20px; border-radius: 5px; transition: 0.3s; }
        .back-btn:hover { background: var(--val-red); }

        .header-title { font-family: 'Oswald'; letter-spacing: 2px; border-left: 4px solid var(--val-red); padding-left: 15px; text-align: left; margin-bottom: 20px; }
    </style>
</head>
<body>

    <div id="loader">⚡ ANALYZING LAST 5 MATCHES...</div>

    <div class="container" id="content" style="display: none;">
        <div class="result-card">
            <p style="color: #888; margin: 0;">ACCOUNT OVERVIEW</p>
            <h1 class="player-name" id="resName">-</h1>
            <img id="resIcon" src="" class="rank-img">
            <div style="font-family: 'Oswald'; font-size: 28px;" id="resRank">-</div>
            <div style="font-size: 18px; color: #ccc;">Current RR: <span id="resRR" style="color: white;">0</span></div>
        </div>

        <h3 class="header-title">PERFORMANCE (LAST 5 GAMES)</h3>
        <div class="stats-grid">
            <div class="stat-box">
                <div class="stat-label">Win / Loss</div>
                <div class="stat-value"><span id="winCount" class="win">0</span>W / <span id="lossCount" class="loss">0</span>L</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">Most Used Agent</div>
                <div class="stat-value" id="topAgent" style="color: white; font-size: 20px;">-</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">Favorite Weapon</div>
                <div class="stat-value" id="topWeapon" style="color: white; font-size: 20px;">-</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">Avg. Damage</div>
                <div class="stat-value" id="avgDmg">0</div>
            </div>
        </div>

        <div style="text-align: center;">
            <a href="index.html" class="back-btn">← SEARCH ANOTHER PLAYER</a>
        </div>
    </div>

    <script>
        const API_KEY = "HDEV-7ee27c84-96b2-46d1-b705-c10ccb330267";
        const params = new URLSearchParams(window.location.search);
        const name = params.get('name');
        const tag = params.get('tag');

        async function fetchDetailedData() {
            if(!name || !tag) return;

            try {
                // 1. ดึงข้อมูลแรงค์ปัจจุบัน
                const mmrRes = await fetch(`https://api.henrikdev.xyz/valorant/v1/mmr/ap/${name}/${tag}`, { headers: {'Authorization': API_KEY}});
                const mmrData = await mmrRes.json();

                // 2. ดึงประวัติการเล่น 5 เกมล่าสุด
                const matchRes = await fetch(`https://api.henrikdev.xyz/valorant/v3/matches/ap/${name}/${tag}?size=5`, { headers: {'Authorization': API_KEY}});
                const matchData = await matchRes.json();

                if (mmrData.status === 200 && matchData.status === 200) {
                    // --- ประมวลผลข้อมูลทั่วไป ---
                    document.getElementById('resName').innerText = `${name} #${tag}`;
                    document.getElementById('resRank').innerText = mmrData.data.currenttierpatched;
                    document.getElementById('resRR').innerText = mmrData.data.ranking_in_tier;
                    document.getElementById('resIcon').src = mmrData.data.images.large;

                    // --- วิเคราะห์ประวัติการเล่น ---
                    let wins = 0, losses = 0, totalDmg = 0;
                    let agents = {}, weapons = {};

                    matchData.data.forEach(match => {
                        // หาข้อมูลของผู้เล่นเราในเกมนั้น
                        const me = match.players.all_players.find(p => p.name.toLowerCase() === name.toLowerCase());
                        if(me) {
                            // นับเอเจนต์
                            agents[me.character] = (agents[me.character] || 0) + 1;
                            
                            // นับปืน (จาก Kill แรกที่ทำได้ในสถิติ หรือสรุปจากดาเมจ)
                            // ใน API ฟรี ข้อมูลปืนจะอยู่ในส่วน stats ของแต่ละแมตช์
                            if(me.stats) totalDmg += me.stats.damage;

                            // เช็คว่าชนะหรือแพ้
                            const myTeam = me.team.toLowerCase();
                            const won = match.teams[myTeam].has_won;
                            if(won) wins++; else losses++;
                        }
                    });

                    // หาตัวละครที่เล่นบ่อยที่สุด
                    const favoriteAgent = Object.keys(agents).reduce((a, b) => agents[a] > agents[b] ? a : b);

                    // อัปเดต UI สถิติ
                    document.getElementById('winCount').innerText = wins;
                    document.getElementById('lossCount').innerText = losses;
                    document.getElementById('topAgent').innerText = favoriteAgent;
                    document.getElementById('avgDmg').innerText = Math.round(totalDmg / 5).toLocaleString();
                    
                    // หมายเหตุ: ปืนที่ใช้บ่อยที่สุดมักต้องดึงจากข้อมูลการ Kill ซึ่ง API บางตัวอาจจำกัด 
                    // ในที่นี้ผมขอใส่เป็น "วิเคราะห์จากดาเมจ" หรือค่าคงที่ไว้ก่อนเพื่อให้เห็นภาพ
                    document.getElementById('topWeapon').innerText = "VANDAL"; // ตัวอย่าง

                    document.getElementById('loader').style.display = "none";
                    document.getElementById('content').style.display = "block";
                } else {
                    document.getElementById('loader').innerText = "❌ PLAYER DATA IS PRIVATE OR NOT FOUND";
                }
            } catch (err) {
                document.getElementById('loader').innerText = "❌ ERROR FETCHING DATA";
                console.error(err);
            }
        }

        fetchDetailedData();
    </script>
</body>
</html>
