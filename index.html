<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkrank | Valorant Tracker</title>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@700&family=Kanit:wght@300;500;600&display=swap" rel="stylesheet">
    <style>
        :root { --val-red: #ff4655; --val-black: #0f1923; --val-white: #ece8e1; }
        * { box-sizing: border-box; scroll-behavior: smooth; }
        body { margin: 0; background-color: var(--val-black); color: var(--val-white); font-family: 'Kanit', sans-serif; overflow: hidden; }

        #bg-slideshow {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background-size: cover;
            background-position: center;
            transition: background-image 1.5s ease-in-out; 
            filter: brightness(0.4); 
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            background: linear-gradient(90deg, #0f1923 30%, transparent 100%);
        }

        .navbar { background: rgba(15, 25, 35, 0.8); display: flex; justify-content: space-between; align-items: center; padding: 20px 60px; border-bottom: 1px solid rgba(255,255,255,0.1); position: sticky; top: 0; z-index: 100; backdrop-filter: blur(10px); }
        .logo { font-family: 'Oswald', sans-serif; font-size: 24px; color: var(--val-red); text-decoration: none; letter-spacing: 2px; }

        .hero { position: relative; height: 100vh; display: flex; align-items: center; padding: 0 10%; z-index: 1; }
        .hero h1 { font-family: 'Oswald', sans-serif; font-size: 90px; line-height: 0.9; margin: 0; text-transform: uppercase; }

        .checker-box { background: rgba(31, 35, 38, 0.9); padding: 35px; border-radius: 5px; border-top: 4px solid var(--val-red); width: 100%; max-width: 450px; margin-top: 35px; backdrop-filter: blur(5px); }
        .input-group { display: flex; gap: 10px; margin-bottom: 15px; }
        input { flex: 1; padding: 15px; border: none; background: #2f353a; color: white; border-radius: 4px; outline: none; font-family: 'Kanit'; }
        
        .val-btn { background: var(--val-red); color: white; padding: 18px 30px; font-family: 'Oswald'; font-size: 18px; border: none; cursor: pointer; clip-path: polygon(5% 0, 100% 0, 95% 100%, 0% 100%); width: 100%; transition: 0.3s; letter-spacing: 1px; }
        .val-btn:hover { background: white; color: var(--val-black); transform: scale(1.02); }
    </style>
</head>
<body>

    <div id="bg-slideshow"></div>
    <div class="overlay"></div>

    <nav class="navbar">
        <a href="#" class="logo">Check Rank</a>
    </nav>

    <div class="hero">
        <div class="hero-content">
            <h1 style="color: var(--val-red);">Check</h1>
            <h1>Ranking</h1>
            <p style="font-size: 1.2rem; color: #ccc;">วิเคราะห์สถิติและอันดับของคุณในโลกของ VALORANT</p>
            
            <div class="checker-box">
                <div class="input-group">
                    <input type="text" id="pName" placeholder="ชื่อผู้เล่น (เช่น TenZ)">
                    <input type="text" id="pTag" placeholder="Tag" style="max-width: 100px;">
                </div>
                <button class="val-btn" onclick="goToResult()">วิเคราะห์แรงค์</button>
            </div>
        </div>
    </div>

    <script>
        const images = [
            'https://static.invenglobal.com/upload/image/2020/04/02/i1585819016848035.jpeg',
            'https://news.codashop.com/th/wp-content/uploads/sites/9/2023/04/VALO-Reyna-Agent-Guide-.jpg',
            'https://news.codashop.com/ph/wp-content/uploads/sites/5/2023/02/VALORANT-Sova-Agent-Complete-Guide.jpg',
            'https://news.codashop.com/ph/wp-content/uploads/sites/5/2023/01/VALORANT-How-to-play-Omen.jpg',
            'https://i.ytimg.com/vi/FUoqAn5T4h4/maxresdefault.jpg'
        ];

        let currentIndex = 0;
        const bgElement = document.getElementById('bg-slideshow');

        function changeBackground() {
            bgElement.style.backgroundImage = `url('${images[currentIndex]}')`;
            currentIndex = (currentIndex + 1) % images.length;
        }

        changeBackground();
        setInterval(changeBackground, 5000);

        function goToResult() {
            const name = document.getElementById('pName').value.trim();
            const tag = document.getElementById('pTag').value.trim().replace('#', '');
            if(!name || !tag) return alert("กรุณากรอกข้อมูลให้ครบ");
            window.location.href = `result.html?name=${encodeURIComponent(name)}&tag=${encodeURIComponent(tag)}`;
        }
    </script>
</body>
</html>
